services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: clauseiq-postgres
    environment:
      POSTGRES_USER: clauseiq
      POSTGRES_PASSWORD: clauseiq
      POSTGRES_DB: clauseiq
    ports:
      - "5432:5432"
    volumes:
      - clauseiq_pgdata:/var/lib/postgresql/data

volumes:
  clauseiq_pgdata:


